{% extends 'base.html' %}
{% block title %}Register - Smart Disaster System{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card card-custom p-4 p-md-5 shadow">
        <div class="text-center mb-4">
          <div class="bg-success bg-opacity-10 text-success p-3 rounded-circle d-inline-flex mb-2 fs-2">
            <i class="bi bi-person-plus-fill"></i>
          </div>
          <h3 class="fw-bold mb-1">Citizen Registration</h3>
          <p class="text-muted small">Join the emergency safety network to receive targeted evacuation alerts.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Username *</label>
              <input type="text" class="form-control rounded-3" name="username" placeholder="e.g. j_doe" required>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Email Address *</label>
              <input type="email" class="form-control rounded-3" name="email" placeholder="name@domain.com" required>
            </div>

            <div class="col-12">
              <label class="form-label small fw-bold text-muted">Full Name *</label>
              <input type="text" class="form-control rounded-3" name="full_name" placeholder="Aarav Sharma" required>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Contact Phone *</label>
              <input type="text" class="form-control rounded-3" name="phone" placeholder="+91 98765 43210" required>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Residential Area / City</label>
              <input type="text" class="form-control rounded-3" name="address" placeholder="Mylapore, Chennai">
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Password *</label>
              <input type="password" class="form-control rounded-3" name="password" placeholder="••••••••" required>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold text-muted">Confirm Password *</label>
              <input type="password" class="form-control rounded-3" name="confirm" placeholder="••••••••" required>
            </div>

            <div class="col-12">
              <div class="p-3 bg-light rounded-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="is_volunteer" id="regVolunteer">
                  <label class="form-check-label small fw-bold" for="regVolunteer">
                    I would like to volunteer for community emergency rescue operations.
                  </label>
                </div>
              </div>
            </div>

            <div class="col-12 mt-4">
              <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">
                <i class="bi bi-person-check-fill me-1"></i> Create Account
              </button>
            </div>

            <div class="col-12 text-center small text-muted">
              Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary fw-bold">Sign In here</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
