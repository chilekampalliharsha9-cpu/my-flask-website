{% extends 'base.html' %}
{% block title %}Citizen Login - Smart Disaster System{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card card-custom p-4 p-md-5 shadow">
        <div class="text-center mb-4">
          <div class="bg-primary bg-opacity-10 text-primary p-3 rounded-circle d-inline-flex mb-2 fs-2">
            <i class="bi bi-shield-lock-fill"></i>
          </div>
          <h3 class="fw-bold mb-1">Citizen Portal Login</h3>
          <p class="text-muted small">Access personal emergency alerts, submit reports, and manage your emergency network.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted" for="loginEmail">Email address</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
              <input id="loginEmail" type="email" class="form-control rounded-end-3" name="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-bold text-muted">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control rounded-end-3" name="password" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </button>

          <div class="text-center small text-muted">
            Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary fw-bold">Register here</a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
