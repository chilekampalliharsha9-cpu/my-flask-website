services:
  - type: web
    name: smart-disaster-ops
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_data.py && gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/mobile-health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
